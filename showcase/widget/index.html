<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src ipc: http://ipc.localhost https://ipc.localhost; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roamies Widget</title>
  <link rel="stylesheet" href="widget.css">
  <script src="widget.js" defer></script>
</head>
<body>
  <header>
    <div id="drag"><span id="title">Widget</span></div>
    <button id="close" type="button" aria-label="Close widget" title="Close widget">×</button>
  </header>
  <main>
    <p id="status" role="status">Loading widget…</p>
    <iframe id="widget" title="Widget" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer" hidden></iframe>
  </main>
</body>
</html>
